<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SGG</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button id="btn-tema" onclick="cambiarTema()">Cambiar Modo</button>

    <div class="formulario">
        <h2>Iniciar Sesión</h2>

        <form id="form-login" onsubmit="iniciarSesion(event)">

            <label for="usuario">Usuario o Email</label>
            <input type="text" id="usuario" placeholder="Ingresá tu usuario o correo" required>

            <label for="password">Contraseña</label>
            <div class="contenedor-password">
                <input type="password" id="password" placeholder="Ingresá tu contraseña" required>
                <button type="button" class="btn-ver-password" onclick="mostrarOcultarPassword('password', this)">Mostrar</button>
            </div>

            <br>

            <button type="submit" id="btn-ingresar">Ingresar</button>

            <p id="mensaje"></p>

        </form>

        <div class="navegacion">
            <a href="registro.html">¿No tenés cuenta? Registrate</a>
            <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
